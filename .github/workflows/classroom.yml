name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrity check - tests, pom.xml and grading.json must be unchanged
        run: |
          EXPECTED="110f605d71f3aba972d4ced1cde35808728be81bbddc5dfe70bc2bff0b6278e2"
          ACTUAL=$( (for f in $(find src/test/java -type f -name '*.java' | LC_ALL=C sort) pom.xml grading.json; do sed 's/\r$//' "$f"; done) | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The test files, pom.xml, or grading.json in this repository differ from the assignment template. Grading has been stopped. Restore the original files (git checkout origin/main -- src/test pom.xml grading.json) and push again."
            exit 1
          fi
          echo "Integrity check passed."
      - name: "Hailstone.hailstoneLength (25)"
        id: hailstonelength
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Hailstone.hailstoneLength"
          setup-command: ''
          command: mvn -B -q test -Dtest=HailstoneLengthTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: "Hailstone.isLongSeq (10)"
        id: islongseq
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Hailstone.isLongSeq"
          setup-command: ''
          command: mvn -B -q test -Dtest=IsLongSeqTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 10
      - name: "Hailstone.propLong (25)"
        id: proplong
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Hailstone.propLong"
          setup-command: ''
          command: mvn -B -q test -Dtest=PropLongTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: "CheckDigit.getCheck (25)"
        id: getcheck
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "CheckDigit.getCheck"
          setup-command: ''
          command: mvn -B -q test -Dtest=GetCheckTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: "CheckDigit.isValid (15)"
        id: isvalid
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "CheckDigit.isValid"
          setup-command: ''
          command: mvn -B -q test -Dtest=IsValidTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 15
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          HAILSTONELENGTH_RESULTS: "${{ steps.hailstonelength.outputs.result }}"
          ISLONGSEQ_RESULTS: "${{ steps.islongseq.outputs.result }}"
          PROPLONG_RESULTS: "${{ steps.proplong.outputs.result }}"
          GETCHECK_RESULTS: "${{ steps.getcheck.outputs.result }}"
          ISVALID_RESULTS: "${{ steps.isvalid.outputs.result }}"
        with:
          runners: hailstonelength,islongseq,proplong,getcheck,isvalid
